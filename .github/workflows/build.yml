name: build

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Digests of the release files
        run: sha256sum main.js manifest.json styles.css

      - uses: actions/upload-artifact@v4
        with:
          name: main.js
          path: main.js
